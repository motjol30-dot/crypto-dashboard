<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة تحليل العملات الرقمية</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2229;
    --border: #21262d;
    --text: #e6edf3;
    --muted: #7d8590;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #e3b341;
    --buy-bg: rgba(63,185,80,0.16);
    --sell-bg: rgba(248,81,73,0.16);
    --wait-bg: rgba(227,179,65,0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Cairo', Tahoma, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    position: relative;
    z-index: 30;
  }

  #btc-ticker {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; flex-shrink: 0;
  }
  #btc-ticker .label { font-size: 0.65rem; color: var(--muted); font-weight: 700; }
  #btc-ticker .price  { font-size: 0.95rem; font-weight: 800; font-family: 'Courier New', monospace; }

  #macro-row {
    flex: 1; display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .macro-box {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 5px 4px; background: var(--bg); border-left: 1px solid var(--border); min-width: 0;
  }
  .macro-box:last-child { border-left: none; }
  .macro-label { font-size: 0.6rem; color: var(--muted); font-weight: 800; }
  .macro-price { font-size: 0.78rem; font-weight: 800; font-family: 'Courier New', monospace; white-space: nowrap; }

  #symbol-row {
    background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 10px;
  }

  #symbol-wrap { width: 100%; min-width: 0; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #symbol-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 8px 10px; border-radius: 8px;
    font-size: 0.9rem; text-align: center; outline: none;
  }
  #symbol-input:focus { border-color: var(--accent); }
  #symbol-live-price {
    font-size: 0.72rem; font-weight: 800; font-family: 'Courier New', monospace;
    color: var(--muted); transition: color .3s;
  }

  #tf-bar-wrap { padding: 8px 10px 0; }
  #tf-bar { display: flex; gap: 4px; }
  .tf-box {
    flex: 1; text-align: center; padding: 7px 2px; border-radius: 7px;
    font-size: 0.75rem; font-weight: 800; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  }
  .tf-box.active { outline: 2px solid var(--text); }

  #conn-dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--red); flex-shrink: 0;
  }
  #conn-dot.connected { background: var(--green); }

  #chart-header {
    padding: 6px 12px; display: flex; align-items: baseline; gap: 10px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }

  #chart-symbol { font-size: 1rem; font-weight: 700; }
  #chart-price  { font-size: 1.15rem; font-weight: 800; font-family: 'Courier New', monospace; }
  #chart-container { position: relative; height: 46vh; min-height: 260px; }

  /* تنسيق القوائم المنسدلة للمربعات الأربعة */
  .dropdown-boxes {
    display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .dropdown-box {
    flex: 1; min-width: 140px; display: flex; flex-direction: column; gap: 5px;
  }
  .dropdown-box label {
    font-size: 0.75rem; font-weight: 800; color: var(--accent);
  }
  .dropdown-box select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 8px; border-radius: 6px; outline: none; font-size: 0.8rem;
  }

  #final-verdict-row {
    padding: 15px 10px; background: var(--surface2); border-bottom: 2px solid var(--accent);
    text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .final-label { font-size: 0.85rem; color: var(--text); font-weight: 800; }
  #final-verdict-row select {
    background: var(--bg); border: 1px solid var(--accent); color: var(--text);
    padding: 10px; border-radius: 8px; outline: none; font-size: 0.9rem; width: 80%; max-width: 300px;
  }

  #save-btn-wrap { padding: 15px; text-align: center; }
  #save-all-btn {
    background: var(--accent); color: #fff; border: none; padding: 12px 24px;
    border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: opacity 0.2s;
  }
  #save-all-btn:hover { opacity: 0.8; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div id="macro-row">
    <div class="macro-box" id="macro-btc">
      <span class="macro-label">BTC</span>
      <span class="macro-price" id="macro-btc-price">—</span>
    </div>
    <div class="macro-box" id="macro-gold">
      <span class="macro-label">🥇XAU</span>
      <span class="macro-price" id="macro-gold-price">—</span>
    </div>
    <div class="macro-box" id="macro-dxy">
      <span class="macro-label">DXY</span>
      <span class="macro-price" id="macro-dxy-price">—</span>
    </div>
  </div>
  <div id="conn-dot"></div>
</header>

<div id="symbol-row">
  <div id="symbol-wrap">
    <input id="symbol-input" placeholder="اكتب رمز العملة… BTCUSDT" value="BTCUSDT" autocomplete="off" />
    <span id="symbol-live-price">—</span>
  </div>
</div>

<div id="tf-bar-wrap">
  <div style="font-size: 0.65rem; color: var(--muted); margin-bottom: 5px;">⏱️ الفريمات</div>
  <div id="tf-bar">
    <div class="tf-box active" data-interval="5m">5د</div>
    <div class="tf-box" data-interval="15m">15د</div>
    <div class="tf-box" data-interval="30m">30د</div>
    <div class="tf-box" data-interval="1h">1س</div>
  </div>
</div>

<div id="chart-header">
  <span id="chart-symbol">BTCUSDT</span>
  <span id="chart-price">—</span>
</div>
<div id="chart-container"></div>

<!-- المربعات الأربعة المطلوبة كقوائم منسدلة -->
<div class="dropdown-boxes">
  <div class="dropdown-box">
    <label>مربع الفريم</label>
    <select id="box-frame">
      <option value="5m">5 دقائق</option>
      <option value="15m">15 دقيقة</option>
      <option value="30m">30 دقيقة</option>
      <option value="1h">1 ساعة</option>
    </select>
  </div>
  
  <div class="dropdown-box">
    <label>مربع الارتداد</label>
    <select id="box-reversal">
      <option value="stability">1. الثبات</option>
      <option value="reversal">2. الارتداد</option>
      <option value="momentum">3. إجماع الزخم</option>
      <option value="hourly">4. طبقة الساعة</option>
    </select>
  </div>

  <div class="dropdown-box">
    <label>مربع التحليل</label>
    <select id="box-analysis">
      <option value="trend">1. الاتجاه</option>
      <option value="confidence">2. الثقة</option>
      <option value="recommendations">3. التوصيات</option>
      <option value="volume">4. إجماع الحجم</option>
    </select>
  </div>

  <div class="dropdown-box">
    <label>مربع القرار</label>
    <select id="box-decision">
      <option value="pending">قيد الانتظار...</option>
      <option value="buy">شراء</option>
      <option value="sell">بيع</option>
      <option value="neutral">محايد</option>
    </select>
  </div>
</div>

<!-- القرار النهائي يضم المربعات الأربعة -->
<div id="final-verdict-row">
  <div class="final-label">🎯 القرار النهائي</div>
  <select id="final-decision-select">
    <option value="frame">مربع الفريم</option>
    <option value="reversal">مربع الارتداد</option>
    <option value="analysis">مربع التحليل</option>
    <option value="decision">مربع القرار</option>
  </select>
</div>

<!-- زر حفظ كل شيء باللون الأزرق المفضل -->
<div id="save-btn-wrap">
  <button id="save-all-btn" onclick="alert('تم حفظ كافة الإعدادات والمؤشرات بنجاح!')">💾 حفظ كل شيء</button>
</div>

<script>
  let chart = null;
  let candleSeries = null;

  function initChart() {
    const container = document.getElementById('chart-container');
    chart = LightweightCharts.createChart(container, {
      layout: { background: { color: '#0d1117' }, textColor: '#7d8590' },
      grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { visible: false },
      leftPriceScale:  { visible: true, borderColor: '#21262d' },
    });
    candleSeries = chart.addCandlestickSeries({
      upColor: '#3fb950', downColor: '#f85149',
      borderUpColor: '#3fb950', borderDownColor: '#f85149',
      wickUpColor: '#3fb950', wickDownColor: '#f85149',
    });
    new ResizeObserver(() => {
      const r = container.getBoundingClientRect();
      chart.resize(r.width, r.height);
    }).observe(container);
  }

  // التهيئة الأولية للشارت
  document.addEventListener("DOMContentLoaded", () => {
    initChart();
  });
</script>
</body>
</html>
