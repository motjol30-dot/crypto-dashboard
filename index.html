<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة تحليل العملات الرقمية</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #21262d;
    --text: #e6edf3;
    --muted: #7d8590;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #e3b341;
    --buy-bg: rgba(63,185,80,0.12);
    --sell-bg: rgba(248,81,73,0.12);
    --wait-bg: rgba(227,179,65,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Cairo', Tahoma, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.9rem;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: var(--accent); }
  .tf-btns { display: flex; gap: 6px; }
  .tf-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tf-btn:hover { border-color: var(--accent); color: var(--text); }
  .tf-btn.active { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 700; }
  #conn-status {
    font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; font-weight: 600;
  }
  #conn-status.connected    { background: rgba(63,185,80,0.15); color: var(--green); }
  #conn-status.disconnected { background: rgba(248,81,73,0.15); color: var(--red); }
  #conn-status.connecting   { background: rgba(227,179,65,0.15); color: var(--yellow); }

  /* ── Main layout ── */
  main { flex: 1; display: flex; overflow: hidden; }

  /* ── Chart area ── */
  #chart-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chart-header {
    padding: 8px 16px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  #chart-symbol { font-size: 1.3rem; font-weight: 700; }
  #chart-price  { font-size: 1.5rem; font-weight: 700; font-family: 'Courier New', monospace; transition: color 0.3s; }
  #chart-change { font-size: 0.9rem; font-weight: 600; }
  #chart-container { flex: 1; position: relative; }

  /* ── Side panel ── */
  #panel {
    width: 310px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ── Trend badge ── */
  #trend-badge {
    text-align: center; padding: 16px; border-radius: 12px;
    font-size: 2rem; font-weight: 900; letter-spacing: 2px; transition: all 0.4s;
  }
  #trend-badge.up      { background: var(--buy-bg);  color: var(--green);  border: 1px solid rgba(63,185,80,0.3); }
  #trend-badge.down    { background: var(--sell-bg);  color: var(--red);    border: 1px solid rgba(248,81,73,0.3); }
  #trend-badge.neutral { background: var(--wait-bg); color: var(--yellow); border: 1px solid rgba(227,179,65,0.3); }

  /* ── Action badge ── */
  #action-badge {
    text-align: center; padding: 10px; border-radius: 8px;
    font-size: 1rem; font-weight: 700; letter-spacing: 1px; transition: all 0.3s;
  }
  #action-badge.buy  { background: var(--buy-bg);  color: var(--green); }
  #action-badge.sell { background: var(--sell-bg);  color: var(--red); }
  #action-badge.wait { background: var(--wait-bg); color: var(--yellow); }

  /* ── Confidence ── */
  .section-title {
    font-size: 0.75rem; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
  }
  .conf-row { display: flex; align-items: center; gap: 8px; }
  .conf-bar-wrap { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  #conf-bar { height: 100%; border-radius: 4px; transition: width 0.5s ease, background 0.3s; }
  #conf-value { font-size: 0.9rem; font-weight: 700; min-width: 36px; text-align: left; }

  /* ── Indicators grid ── */
  .indicators-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ind-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .ind-label { font-size: 0.7rem; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .ind-value { font-size: 1rem; font-weight: 700; margin-top: 2px; font-family: 'Courier New', monospace; }
  .ind-sub   { font-size: 0.7rem; color: var(--muted); margin-top: 1px; }

  /* ── Zones ── */
  .zones-row { display: flex; gap: 8px; }
  .zone-card { flex: 1; border-radius: 8px; padding: 10px; text-align: center; }
  .zone-card.buy-zone  { background: var(--buy-bg);  border: 1px solid rgba(63,185,80,0.3); }
  .zone-card.sell-zone { background: var(--sell-bg);  border: 1px solid rgba(248,81,73,0.3); }
  .zone-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .zone-card.buy-zone  .zone-label { color: var(--green); }
  .zone-card.sell-zone .zone-label { color: var(--red); }
  .zone-range { font-size: 0.72rem; color: var(--muted); margin-top: 4px; font-family: 'Courier New', monospace; line-height: 1.5; }

  /* ── Notes ── */
  #notes-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  #notes-list li {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font-size: 0.78rem; line-height: 1.5;
  }
  #notes-list li::before { content: '◈ '; color: var(--accent); }

  /* ── Loading ── */
  #loading {
    position: absolute; inset: 0; background: rgba(13,17,23,0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; z-index: 10;
  }
  #loading.hidden { display: none; }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: var(--muted); font-size: 0.9rem; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>📊 تحليل العملات الرقمية</h1>
  <div class="controls">
    <select id="symbol-select">
      <option value="BTCUSDT">بيتكوين / BTCUSDT</option>
      <option value="ETHUSDT">إيثريوم / ETHUSDT</option>
      <option value="BNBUSDT">بينانس / BNBUSDT</option>
      <option value="SOLUSDT">سولانا / SOLUSDT</option>
      <option value="XRPUSDT">ريبل / XRPUSDT</option>
      <option value="DOGEUSDT">دوج / DOGEUSDT</option>
      <option value="ADAUSDT">كاردانو / ADAUSDT</option>
      <option value="AVAXUSDT">أفالانش / AVAXUSDT</option>
    </select>
    <div class="tf-btns">
      <button class="tf-btn active" data-interval="5m">5 دقائق</button>
      <button class="tf-btn" data-interval="15m">15 دقيقة</button>
      <button class="tf-btn" data-interval="30m">نص ساعة</button>
    </div>
  </div>
  <div id="conn-status" class="connecting">جاري الاتصال...</div>
</header>

<main>
  <!-- Side panel (right in RTL) -->
  <div id="panel">
    <div>
      <div class="section-title">الاتجاه</div>
      <div id="trend-badge" class="neutral">—</div>
    </div>
    <div>
      <div class="section-title">التوصية</div>
      <div id="action-badge" class="wait">انتظر</div>
    </div>
    <div>
      <div class="section-title">مستوى الثقة</div>
      <div class="conf-row">
        <div class="conf-bar-wrap"><div id="conf-bar" style="width:0%"></div></div>
        <div id="conf-value">0%</div>
      </div>
    </div>
    <div>
      <div class="section-title">المؤشرات الفنية</div>
      <div class="indicators-grid">
        <div class="ind-card">
          <div class="ind-label">RSI (14)</div>
          <div class="ind-value" id="ind-rsi">—</div>
        </div>
        <div class="ind-card">
          <div class="ind-label">MACD</div>
          <div class="ind-value" id="ind-macd">—</div>
          <div class="ind-sub"  id="ind-macd-sig">إشارة: —</div>
        </div>
        <div class="ind-card">
          <div class="ind-label">EMA 50</div>
          <div class="ind-value" id="ind-ema50">—</div>
        </div>
        <div class="ind-card">
          <div class="ind-label">EMA 200</div>
          <div class="ind-value" id="ind-ema200">—</div>
        </div>
        <div class="ind-card" style="grid-column:span 2">
          <div class="ind-label">بولينجر باندز</div>
          <div style="display:flex;gap:8px;margin-top:4px">
            <div><div class="ind-sub">أعلى</div><div class="ind-value" id="ind-bb-upper" style="font-size:.85rem">—</div></div>
            <div><div class="ind-sub">وسط</div> <div class="ind-value" id="ind-bb-mid"   style="font-size:.85rem">—</div></div>
            <div><div class="ind-sub">أدنى</div> <div class="ind-value" id="ind-bb-lower" style="font-size:.85rem">—</div></div>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div class="section-title">مناطق الشراء والبيع</div>
      <div class="zones-row">
        <div class="zone-card buy-zone">
          <div class="zone-label">🟢 شراء</div>
          <div class="zone-range" id="buy-zone-range">—</div>
        </div>
        <div class="zone-card sell-zone">
          <div class="zone-label">🔴 بيع</div>
          <div class="zone-range" id="sell-zone-range">—</div>
        </div>
      </div>
    </div>
    <div>
      <div class="section-title">ملاحظات التحليل</div>
      <ul id="notes-list"></ul>
    </div>
  </div>

  <!-- Chart area -->
  <div id="chart-area">
    <div id="chart-header">
      <span id="chart-symbol">BTCUSDT</span>
      <span id="chart-price" style="color:var(--text)">—</span>
      <span id="chart-change"></span>
    </div>
    <div id="chart-container">
      <div id="loading">
        <div class="spinner"></div>
        <p>جاري تحميل البيانات...</p>
      </div>
    </div>
  </div>
</main>

<script>
  let currentSymbol = 'BTCUSDT';
  let currentInterval = '5m';
  let ws = null;
  let chart = null;
  let candleSeries = null;
  let lastPrice = null;

  // ── Chart ──────────────────────────────────────────────────────────────────
  function initChart() {
    const container = document.getElementById('chart-container');
    if (chart) chart.remove();
    chart = LightweightCharts.createChart(container, {
      layout: { background: { color: '#0d1117' }, textColor: '#7d8590' },
      grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
      crosshair: {
        mode: LightweightCharts.CrosshairMode.Normal,
        vertLine: { color: '#58a6ff', labelBackgroundColor: '#1f6feb' },
        horzLine: { color: '#58a6ff', labelBackgroundColor: '#1f6feb' },
      },
      rightPriceScale: { visible: false },
      leftPriceScale:  { visible: true, borderColor: '#21262d' },
      timeScale: { borderColor: '#21262d', timeVisible: true, secondsVisible: false },
      watermark: { visible: false },
    });
    candleSeries = chart.addCandlestickSeries({
      upColor: '#3fb950', downColor: '#f85149',
      borderUpColor: '#3fb950', borderDownColor: '#f85149',
      wickUpColor: '#3fb950', wickDownColor: '#f85149',
      priceScaleId: 'left',
    });
    new ResizeObserver(() => {
      const r = container.getBoundingClientRect();
      chart.resize(r.width, r.height);
    }).observe(container);
  }

  // ── WebSocket ──────────────────────────────────────────────────────────────
  function connect() {
    if (ws) { ws.close(); ws = null; }
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);
    setStatus('connecting');
    ws.onopen    = () => { setStatus('connected'); subscribe(); };
    ws.onmessage = (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === 'update') handleUpdate(msg);
    };
    ws.onclose   = () => { setStatus('disconnected'); setTimeout(connect, 3000); };
    ws.onerror   = () => ws.close();
  }

  function subscribe() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      showLoading(true);
      ws.send(JSON.stringify({ type: 'subscribe', symbol: currentSymbol, interval: currentInterval }));
    }
  }

  // ── Update ─────────────────────────────────────────────────────────────────
  function handleUpdate(msg) {
    if (msg.symbol !== currentSymbol || msg.interval !== currentInterval) return;
    showLoading(false);

    // Chart data
    candleSeries.setData(msg.candles.map(c => ({
      time: c.time, open: c.open, high: c.high, low: c.low, close: c.close,
    })));

    // Price header
    const latest = msg.candles[msg.candles.length - 1];
    if (latest) {
      const priceEl = document.getElementById('chart-price');
      priceEl.textContent = fmt(latest.close);
      if (lastPrice !== null) {
        const up = latest.close >= lastPrice;
        priceEl.style.color = up ? 'var(--green)' : 'var(--red)';
        const pct = (((latest.close - lastPrice) / lastPrice) * 100).toFixed(2);
        const chEl = document.getElementById('chart-change');
        chEl.textContent = `${up ? '+' : ''}${pct}%`;
        chEl.style.color = up ? 'var(--green)' : 'var(--red)';
      }
      lastPrice = latest.close;
    }
    document.getElementById('chart-symbol').textContent = msg.symbol;

    // Indicators
    const ind = msg.indicators;
    if (ind) {
      const rsiEl = document.getElementById('ind-rsi');
      if (ind.rsi != null) {
        rsiEl.textContent = ind.rsi.toFixed(1);
        rsiEl.style.color = ind.rsi < 30 ? 'var(--green)' : ind.rsi > 70 ? 'var(--red)' : 'var(--text)';
      }
      if (ind.macd) {
        const macdEl = document.getElementById('ind-macd');
        macdEl.textContent = ind.macd.value != null ? ind.macd.value.toFixed(4) : '—';
        macdEl.style.color = (ind.macd.value != null && ind.macd.signal != null)
          ? ind.macd.value > ind.macd.signal ? 'var(--green)' : 'var(--red)'
          : 'var(--text)';
        document.getElementById('ind-macd-sig').textContent =
          `إشارة: ${ind.macd.signal != null ? ind.macd.signal.toFixed(4) : '—'}`;
      }
      if (ind.ema50 != null) {
        const el = document.getElementById('ind-ema50');
        el.textContent = fmt(ind.ema50);
        el.style.color = ind.currentPrice > ind.ema50 ? 'var(--green)' : 'var(--red)';
      }
      const ema200El = document.getElementById('ind-ema200');
      if (ind.ema200 != null) {
        ema200El.textContent = fmt(ind.ema200);
        ema200El.style.color = ind.currentPrice > ind.ema200 ? 'var(--green)' : 'var(--red)';
      } else {
        ema200El.textContent = 'يتحمّل...';
        ema200El.style.color = 'var(--muted)';
      }
      if (ind.bb) {
        document.getElementById('ind-bb-upper').textContent = fmt(ind.bb.upper);
        document.getElementById('ind-bb-mid').textContent   = fmt(ind.bb.middle);
        document.getElementById('ind-bb-lower').textContent = fmt(ind.bb.lower);
      }
    }

    // Decision
    const d = msg.decision;
    if (d) {
      const trendEl = document.getElementById('trend-badge');
      trendEl.textContent = d.trend;
      trendEl.className = d.trend === 'صعود' ? 'up' : d.trend === 'هبوط' ? 'down' : 'neutral';

      const actEl = document.getElementById('action-badge');
      const actMap = { 'buy zone': 'منطقة شراء', 'sell zone': 'منطقة بيع', 'wait': 'انتظر' };
      actEl.textContent = actMap[d.action] || d.action;
      actEl.className = d.action === 'buy zone' ? 'buy' : d.action === 'sell zone' ? 'sell' : 'wait';

      const conf = Math.min(100, Math.max(0, d.confidence));
      document.getElementById('conf-bar').style.width = conf + '%';
      document.getElementById('conf-bar').style.background =
        d.trend === 'صعود' ? 'var(--green)' : d.trend === 'هبوط' ? 'var(--red)' : 'var(--yellow)';
      document.getElementById('conf-value').textContent = conf + '%';

      if (d.buyZone) document.getElementById('buy-zone-range').innerHTML  = `${d.buyZone.from}<br>– ${d.buyZone.to}`;
      if (d.sellZone) document.getElementById('sell-zone-range').innerHTML = `${d.sellZone.from}<br>– ${d.sellZone.to}`;

      const list = document.getElementById('notes-list');
      list.innerHTML = '';
      (d.notes || []).forEach(n => { const li = document.createElement('li'); li.textContent = n; list.appendChild(li); });
    }
  }

  function fmt(v) {
    if (v == null) return '—';
    if (v >= 1000) return v.toFixed(2);
    if (v >= 1)    return v.toFixed(4);
    return v.toFixed(6);
  }
  function showLoading(s) { document.getElementById('loading').classList.toggle('hidden', !s); }
  function setStatus(s) {
    const el = document.getElementById('conn-status');
    el.className = s;
    el.textContent = { connected: '● متصل', disconnected: '● منقطع', connecting: '● جاري الاتصال...' }[s] || s;
  }

  // ── Controls ───────────────────────────────────────────────────────────────
  document.getElementById('symbol-select').addEventListener('change', e => {
    currentSymbol = e.target.value; lastPrice = null; showLoading(true); subscribe();
  });
  document.querySelectorAll('.tf-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentInterval = btn.dataset.interval; lastPrice = null; showLoading(true); subscribe();
    });
  });

  initChart();
  connect();
</script>
</body>
</html>
